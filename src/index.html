<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftbound</title>
<style>
  :root { --bg: #0d0f0e; --ink: #e8e2d2; --dim: #9a937f; --key: #f0c060; --panel: rgba(14, 16, 15, .82); --line: rgba(232, 226, 210, .14); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.45 ui-monospace, Consolas, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #screen { image-rendering: pixelated; display: block; background: #000; cursor: crosshair; }
  /* F1 (dev mode): THE DEBUG HUD top left (dev/devtools.js drawHud) and THE KEY HELP bottom right (dev/keyhelp.js) */
  #hud, #help { position: fixed; box-sizing: border-box; max-height: calc(100vh - 20px); overflow: hidden; padding: 9px 12px; pointer-events: none;
    background: rgba(12, 14, 13, .84); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.4 "Segoe UI", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #hud { left: 10px; top: 10px; width: 400px; max-width: calc(100vw - 20px); }   /* (clear of the key help, also when F2's panel pushes it left) */
  #hud b { color: var(--key); font-weight: 600; }
  #hud .hd-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  #hud .hd-top b { font-size: 14px; color: #fff; }
  #hud .hd-top span { padding: 0 7px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line); border-radius: 8px; }
  #hud .hd-top em { margin-left: auto; font-style: normal; font-weight: 600; color: var(--key); }
  #hud .hd-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
  #hud .hd-row > i { font-style: normal; font-size: 10px; line-height: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #hud .hd-sys { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 11px; color: #cdc6b4; }
  #help { right: 10px; bottom: 10px; width: min(980px, calc(100vw - 430px)); }
  #help .kh-cols { columns: 4 210px; column-gap: 20px; }
  #help section { break-inside: avoid; margin-bottom: 8px; }
  #help h5 { margin: 0 0 2px; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #help .kh-row { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 8px; padding: 1px 0; }
  #help .kh-row.off { opacity: .32; }
  #help .kh-k { white-space: nowrap; }
  #help .kh-s { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--key); }
  #help kbd { display: inline-block; min-width: 1.2em; padding: 0 4px; font: 600 10.5px/15px "Segoe UI", system-ui, sans-serif; text-align: center; color: #fff;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .26); border-bottom-width: 2px; border-radius: 4px; }
  #help kbd + kbd { margin-left: 2px; }
  #help s { padding: 0 2px; text-decoration: none; color: var(--dim); }
  #help .kh-foot { padding-top: 6px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  #help .kh-foot b { font-weight: 600; color: var(--key); }
  #load { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); font-size: 14px; }
  /* the menu (ui/menu.js): plain white text, centred over the living world, which is blurred (drag it to look around) */
  /* (one 1fr cell: the menu is never taller than the screen, so a long tab scrolls in .m-body instead of running off it) */
  #pause { position: fixed; inset: 0; z-index: 20; display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; padding: 32px 16px 44px; box-sizing: border-box;
    background: rgba(0, 0, 0, .42); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    color: #fff; font: 15px/1.4 "Segoe UI", system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); cursor: grab; animation: m-fade .2s ease-out; }
  #pause.turning { cursor: grabbing; }
  body:has(#pause:not(.hidden)) :is(#hud, #help) { visibility: hidden; }
  @keyframes m-fade { from { opacity: 0; } }
  /* (a fixed height: the header, tabs and pages stay put from tab to tab; only the rows under them change, and a long list scrolls) */
  #menu { position: relative; width: min(500px, 100%); height: min(680px, 100%); display: flex; flex-direction: column; cursor: default; }
  #menu header { padding-bottom: 8px; text-align: center; }
  #menu .m-body { scrollbar-gutter: stable both-edges; }   /* (rows don't shift sideways when a list starts to scroll) */
  .m-title { font-size: 26px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .m-sub { font-size: 13px; opacity: .6; }
  .m-close { position: absolute; top: 2px; right: 0; padding: 2px 4px; font: inherit; font-size: 12px; color: #fff; text-shadow: inherit; opacity: .5; background: none; border: 0; cursor: pointer; }
  .m-close:hover, .m-close:focus-visible { opacity: 1; outline: none; }
  #menu nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; padding: 4px 0 14px; }
  .m-tab { padding: 2px 0; font: inherit; font-size: 14px; color: #fff; text-shadow: inherit; opacity: .5; background: none; border: 0; cursor: pointer; }
  .m-tab:hover, .m-tab:focus-visible { opacity: .85; outline: none; }
  .m-tab.on { opacity: 1; text-decoration: underline; text-underline-offset: 6px; }
  .m-cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 0 0 12px; }
  .m-cat { padding: 2px 9px; font: inherit; font-size: 13px; color: #fff; text-shadow: inherit; opacity: .6; background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px; cursor: pointer; }
  .m-cat:hover, .m-cat:focus-visible { opacity: .9; background: rgba(255, 255, 255, .12); outline: none; }
  .m-cat.on { opacity: 1; background: rgba(255, 255, 255, .2); border-color: rgba(255, 255, 255, .5); }
  .m-body { min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent; }
  .m-body h4 { margin: 14px 10px 2px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
  .m-row, .m-act { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 5px 10px; box-sizing: border-box;
    font: inherit; color: #fff; text-shadow: inherit; text-align: left; opacity: .85; background: none; border: 0; border-radius: 4px; cursor: pointer; }
  .m-row:hover, .m-row:focus-visible, .m-act:hover, .m-act:focus-visible { opacity: 1; background: rgba(255, 255, 255, .09); outline: none; }
  .m-act { justify-content: center; padding: 7px 10px; font-size: 18px; }
  .m-act.tool { padding: 5px 10px; font-size: 15px; }
  .m-row small { margin-left: 8px; font-size: 11px; opacity: .45; }
  .m-row.sub { padding-left: 26px; font-size: 14px; }
  .m-val { display: flex; align-items: center; white-space: nowrap; }
  .m-val i { padding: 0 6px; font-style: normal; opacity: .45; }
  .m-val i:hover { opacity: 1; }
  /* a value's box (ui/menu.js fit): every value it can take in one grid cell, only the current one shown: as wide as the widest */
  .m-v { display: inline-grid; justify-items: center; font-variant-numeric: tabular-nums; }
  .m-v > span { grid-area: 1 / 1; visibility: hidden; }
  .m-v > .on { visibility: visible; }
  .m-keys > div { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 3px 10px; font-size: 14px; }
  .m-keys > div > span:first-child { opacity: .55; }
  .m-note { margin: 14px 10px 0; font-size: 12px; opacity: .45; }
  .m-hint { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; opacity: .5; }
  .hidden { display: none !important; }
  /* game screens (game/screens.js): title, augment pick, run over */
  #gscreen { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(6, 8, 7, .25), rgba(6, 8, 7, .72)); font-family: "Segoe UI", system-ui, sans-serif; }
  .gs-panel { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 24px; background: rgba(18, 20, 19, .9); border: 1px solid var(--line); border-radius: 10px; text-align: center; }
  .gs-logo { font-size: clamp(34px, 8vw, 54px); font-weight: 800; letter-spacing: .14em; color: var(--key); text-shadow: 0 3px 0 #5a3a10; }
  .gs-h { font-size: 30px; font-weight: 800; color: var(--key); }
  .gs-sub { margin: 4px 0 18px; color: var(--dim); font-size: 13px; }
  .gs-panel > button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; margin: 8px 0; padding: 11px 14px; font: inherit; font-size: 15px; color: var(--ink); background: #1c201d; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-align: left; }
  .gs-panel > button span { color: var(--dim); font-size: 12px; }
  .gs-panel > button:hover, .gs-card:hover { border-color: var(--key); }
  .gs-panel > button.gs-main { background: #2a2414; border-color: rgba(240, 192, 96, .45); }
  .gs-rec { margin-top: 14px; color: var(--dim); font-size: 12px; }
  .gs-new { color: var(--key); font-weight: 700; }
  .gs-keys { margin-top: 10px; color: #6f6a5c; font-size: 11px; line-height: 1.6; }
  .gs-pick { width: min(760px, 100%); }
  .gs-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .gs-card { position: relative; display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 18px 14px 16px; font: inherit; color: var(--ink); background: #1c201d; border: 1px solid rgba(240, 192, 96, .35); border-radius: 8px; cursor: pointer; }
  .gs-card b { font-size: 17px; color: var(--key); }
  .gs-card span { font-size: 13px; color: #cfc8b6; line-height: 1.4; }
  .gs-card .gs-glyph { font-size: 34px; color: var(--key); line-height: 1; }
  .gs-card i { position: absolute; top: 6px; left: 9px; font-style: normal; font-size: 11px; color: var(--dim); }
  .gs-stats { margin: 0 auto 8px; border-collapse: collapse; font-size: 14px; }
  .gs-stats td { padding: 3px 10px; text-align: left; vertical-align: top; }
  .gs-stats td:first-child { color: var(--dim); text-align: right; }
  @media (max-width: 720px) { #help { display: none; } #hud { max-width: calc(100vw - 40px); } .m-hint { display: none; } }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="wrap"><canvas id="screen"></canvas></div>
<div id="hud" class="hidden"></div>
<div id="help" class="hidden"></div>   <!-- the key help: dev/keyhelp.js builds it -->
<div id="pause" class="hidden"></div>
<div id="load">Loading…</div>
<script type="module" src="main.js"></script>
</body>
</html>
