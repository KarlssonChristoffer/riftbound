<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookbook</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--accent:#ff7a2f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#f3eee6}
#c{display:block;width:100vw;height:100vh}
#ui,#world{position:fixed;inset:0;pointer-events:none}
.card{position:absolute;top:20px;left:20px;max-width:380px;padding:14px 18px;background:rgba(10,8,14,.55);border:1px solid rgba(255,255,255,.08);border-left:3px solid var(--accent);border-radius:6px;backdrop-filter:blur(6px)}
.card h1{font-family:Cinzel,serif;font-size:28px;font-weight:700;margin:0;letter-spacing:.04em}
.card .sub{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-top:2px}
.card p{font-size:13px;line-height:1.55;margin:8px 0 0;color:#d6cfc4}
.top{position:absolute;top:20px;right:20px;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:56vw}
.top button{font:600 12px Inter,sans-serif;color:#eee;background:rgba(10,8,14,.6);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:6px;cursor:pointer;backdrop-filter:blur(6px)}
.top button:hover{border-color:rgba(255,255,255,.35)}
.top button.on{border-color:var(--accent);color:#fff;box-shadow:inset 0 0 0 1px var(--accent)}
.top .sep{width:12px}
.bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:12px;pointer-events:auto}
.slot{width:70px;height:70px;border-radius:12px;position:relative;background:#16121c;border:1px solid rgba(255,255,255,.16);cursor:pointer;overflow:hidden;transition:box-shadow .15s,transform .1s}
.slot .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 60%,transparent),transparent 72%);text-shadow:0 0 14px var(--c)}
.slot .key{position:absolute;top:4px;left:6px;font-size:11px;font-weight:800;color:#fff;opacity:.9}
.slot .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--p,0)*360deg),transparent 0)}
.slot.flash{box-shadow:0 0 0 2px var(--c),0 0 26px var(--c);transform:scale(1.06)}
.tip{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);text-align:center;width:min(560px,92vw);transition:opacity .3s}
.tip b{font-family:Cinzel,serif;font-size:20px;font-weight:700;letter-spacing:.03em;text-shadow:0 2px 8px #000}
.tip span{display:block;font-size:13px;color:#e2dbd0;margin-top:3px;text-shadow:0 1px 4px #000}
.hint{position:absolute;bottom:20px;left:20px;font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.04em;line-height:1.7}
.dmg{position:absolute;font-weight:800;font-size:19px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.9);white-space:nowrap;will-change:transform}
.hp{position:absolute;width:46px;height:5px;background:rgba(0,0,0,.6);outline:1px solid rgba(0,0,0,.7);transform:translate(-50%,-50%);border-radius:2px;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(#ff6a5a,#c9302a)}
#load{position:fixed;inset:0;display:grid;place-items:center;font:600 13px Inter;letter-spacing:.2em;color:#999;background:#000;transition:opacity .6s}
@media (max-width:700px){.card{max-width:calc(100vw - 40px)}.top{top:auto;bottom:112px;right:12px;left:12px;justify-content:center;max-width:none}.tip{bottom:170px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="world"></div>
<div id="ui">
  <div class="card"><h1 id="name"></h1><div class="sub" id="sub"></div><p id="blurb"></p></div>
  <div class="top" id="top"></div>
  <div class="tip" id="tip"><b id="tipName"></b><span id="tipDesc"></span></div>
  <div class="bar" id="bar"></div>
  <div class="hint">Q W E cast &nbsp;·&nbsp; 1–4 switch hero &nbsp;·&nbsp; C camera &nbsp;·&nbsp; A auto-cast &nbsp;·&nbsp; M models on/off</div>
</div>
<div id="load">LOADING</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

// ---------- core ----------
const $=s=>document.querySelector(s);
const canvas=$('#c'),worldUI=$('#world');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,400);
const composer=new EffectComposer(renderer);
const renderPass=new RenderPass(new THREE.Scene(),camera);composer.addPass(renderPass);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.5,.8);composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});

const TAU=Math.PI*2,UP=new THREE.Vector3(0,1,0),WHITE=new THREE.Color(1,1,1),ICE=new THREE.Color(.35,.75,1.2);
const rand=(a,b)=>a+Math.random()*(b-a);
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerpAngle=(a,b,k)=>{const d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*k};
const C={fire:new THREE.Color(1,.42,.08),ember:new THREE.Color(1,.18,.03),gold:new THREE.Color(1,.78,.3),ice:new THREE.Color(.45,.8,1),white:new THREE.Color(1,1,1),void:new THREE.Color(.62,.25,1),pink:new THREE.Color(1,.3,.75),green:new THREE.Color(.45,1,.35),leaf:new THREE.Color(.75,1,.25),bolt:new THREE.Color(.55,.75,1),snow:new THREE.Color(.8,.85,.95)};

const W={scene:null,enemies:[],lights:[],shake:0,def:null,hero:null,auto:true,autoT:1.2,next:0};

function std(c,o={}){return new THREE.MeshStandardMaterial({color:c,roughness:o.r??.8,metalness:o.m??0,emissive:o.e??0,emissiveIntensity:o.ei??1,flatShading:!!o.f,transparent:!!o.t,opacity:o.o??1,side:o.ds?THREE.DoubleSide:THREE.FrontSide})}
const sv=(m,o)=>{m.setValues(o);return m};
function glow(c,k=4,o={}){const m=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k),transparent:!!o.add||o.o!==undefined,opacity:o.o??1,side:o.ds?THREE.DoubleSide:THREE.FrontSide,fog:o.fog??true});if(o.add){m.blending=THREE.AdditiveBlending;m.depthWrite=false}return m}
function add(par,geo,mat,x=0,y=0,z=0,o={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;if(o.s!==undefined){typeof o.s==='number'?m.scale.setScalar(o.s):m.scale.set(...o.s)}m.castShadow=o.cast??!mat.isMeshBasicMaterial;m.receiveShadow=!mat.isMeshBasicMaterial;par.add(m);return m}
function ctex(w,h,draw,rep=1,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=8;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
function blotches(g,w,h,cols,n,r0,r1,al=.3){for(let i=0;i<n;i++){g.globalAlpha=al*Math.random();g.fillStyle=cols[i%cols.length];const x=Math.random()*w,y=Math.random()*h,r=rand(r0,r1);for(const dx of[-w,0,w])for(const dy of[-h,0,h]){g.beginPath();g.arc(x+dx,y+dy,r,0,TAU);g.fill()}}g.globalAlpha=1}
function cracks(g,w,h,n,col,lw0,lw1,step=14,len=14){g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';for(let i=0;i<n;i++){let x=Math.random()*w,y=Math.random()*h,a=Math.random()*TAU;g.lineWidth=rand(lw0,lw1);g.beginPath();g.moveTo(x,y);for(let k=0;k<len;k++){a+=rand(-.7,.7);x+=Math.cos(a)*step;y+=Math.sin(a)*step;g.lineTo(x,y)}g.stroke()}}
const glowTex=ctex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,'rgba(255,255,255,.55)');gr.addColorStop(.6,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128)},1,false);
glowTex.userData.keep=true;
function glowSprite(c,k,size,fog=true){const m=new THREE.SpriteMaterial({map:glowTex,color:new THREE.Color(c).multiplyScalar(k),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,fog});const s=new THREE.Sprite(m);s.scale.setScalar(size);return s}

// ---------- particles ----------
class Particles{
  constructor(max){this.max=max;this.i=0;const A=n=>new Float32Array(max*n);
    this.p=A(3);this.v=A(3);this.c=A(3);this.s=A(1);this.a=A(1);this.l=A(1);this.ml=A(1);this.s0=A(1);this.gr=A(1);this.dr=A(1);this.at=A(1);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.p,3));g.setAttribute('pcol',new THREE.BufferAttribute(this.c,3));
    g.setAttribute('size',new THREE.BufferAttribute(this.s,1));g.setAttribute('alpha',new THREE.BufferAttribute(this.a,1));
    this.mat=new THREE.ShaderMaterial({uniforms:{pr:{value:renderer.getPixelRatio()}},
      vertexShader:`uniform float pr;attribute float size;attribute float alpha;attribute vec3 pcol;varying vec3 vC;varying float vA;
      void main(){vC=pcol;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=alpha<=0.0?0.0:size*pr*(420.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
      fragmentShader:`varying vec3 vC;varying float vA;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;float a=pow(1.0-r*2.0,1.5);gl_FragColor=vec4(vC*a*vA,1.0);}`,
      blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});
    this.mat.userData.keep=true;g.userData.keep=true;
    this.obj=new THREE.Points(g,this.mat);this.obj.frustumCulled=false;this.g=g;this.attr=null;this.attrK=0}
  reset(){this.l.fill(0);this.a.fill(0);this.attr=null}
  emit(x,y,z,vx,vy,vz,col,b,life,size,grav=0,drag=0,at=0){const i=this.i;this.i=(i+1)%this.max;const j=i*3;
    this.p[j]=x;this.p[j+1]=y;this.p[j+2]=z;this.v[j]=vx;this.v[j+1]=vy;this.v[j+2]=vz;
    this.c[j]=col.r*b;this.c[j+1]=col.g*b;this.c[j+2]=col.b*b;this.l[i]=this.ml[i]=life;this.s0[i]=size;this.gr[i]=grav;this.dr[i]=drag;this.at[i]=at}
  burst(pos,n,o){const J=o.jit||0;for(let k=0;k<n;k++){const col=o.cols?o.cols[k%o.cols.length]:o.col;let dx=rand(-1,1),dy=rand(-1,1),dz=rand(-1,1);const L=Math.hypot(dx,dy,dz)||1;const sp=o.speed*rand(.25,1);dx/=L;dy/=L;dz/=L;if(o.flat)dy*=.25;
    this.emit(pos.x+rand(-J,J),pos.y+rand(-J,J),pos.z+rand(-J,J),dx*sp,dy*sp+(o.up||0),dz*sp,col,(o.b||3)*rand(.6,1.2),(o.life||.8)*rand(.6,1.2),(o.size||.25)*rand(.6,1.3),o.grav||0,o.drag||0,0)}}
  update(dt){const {p,v,l,ml,s,s0,a,gr,dr,at}=this,A=this.attr,K=this.attrK;
    for(let i=0;i<this.max;i++){if(l[i]<=0){a[i]=0;continue}l[i]-=dt;const j=i*3;
      if(at[i]&&A){const dx=A.x-p[j],dy=A.y-p[j+1],dz=A.z-p[j+2];const d=Math.hypot(dx,dy,dz)+.001;const f=K*dt/Math.max(d,.6);v[j]+=dx/d*f;v[j+1]+=dy/d*f;v[j+2]+=dz/d*f;if(d<.45)l[i]=0}
      v[j+1]-=gr[i]*dt;const dk=1-Math.min(1,dr[i]*dt);v[j]*=dk;v[j+1]*=dk;v[j+2]*=dk;p[j]+=v[j]*dt;p[j+1]+=v[j+1]*dt;p[j+2]+=v[j+2]*dt;
      const k=Math.max(0,l[i]/ml[i]);a[i]=Math.min(1,(1-k)*12)*Math.min(1,k*2.2);s[i]=s0[i]*(.35+.65*k)}
    for(const n of['position','pcol','size','alpha'])this.g.attributes[n].needsUpdate=true}
}
const parts=new Particles(14000);
W.parts=parts;

// ---------- fx system ----------
let FX=[];
function fx(dur,up,end){const f={t:0,dur,up,end};FX.push(f);return f}
function after(t,fn){return fx(t,null,fn)}
function takeLight(col,int,dist){const L=W.lights.find(l=>!l.userData.busy);if(!L)return{position:V(),intensity:0,color:new THREE.Color(),userData:{}};L.userData.busy=true;L.color.set(col);L.intensity=int;L.distance=dist;return L}
function freeLight(L){L.intensity=0;L.userData.busy=false}
function flashLight(pos,col,int,dur,dist=8){const L=takeLight(col,int,dist);L.position.copy(pos);fx(dur,k=>{L.intensity=int*(1-k)*(1-k)},()=>freeLight(L))}
const ringGeo=new THREE.RingGeometry(.86,1,72);ringGeo.userData.keep=true;
const thinRing=new THREE.RingGeometry(.95,1,72);thinRing.userData.keep=true;
const discGeo=new THREE.CircleGeometry(1,48);discGeo.userData.keep=true;
const planeGeo=new THREE.PlaneGeometry(2,2);planeGeo.userData.keep=true;
const cylGeo=new THREE.CylinderGeometry(1,1,1,6,1,true);cylGeo.userData.keep=true;
function shockwave(pos,col,R,dur=.5,k=4,y=.07){const m=glow(col,k,{add:true,ds:true});const r=new THREE.Mesh(ringGeo,m);r.rotation.x=-Math.PI/2;r.position.set(pos.x,y,pos.z);W.scene.add(r);
  fx(dur,t=>{const e=1-Math.pow(1-t,3);r.scale.setScalar(.2+R*e);m.opacity=1-t},()=>{W.scene.remove(r);m.dispose()})}
function scorch(pos,R,dur=4,op=.75){const m=new THREE.MeshBasicMaterial({map:glowTex,color:0x000000,transparent:true,opacity:op,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});const d=new THREE.Mesh(planeGeo,m);d.rotation.x=-Math.PI/2;d.position.set(pos.x,.04,pos.z);d.scale.setScalar(R);W.scene.add(d);
  fx(dur,k=>{m.opacity=op*(1-k*k)},()=>{W.scene.remove(d);m.dispose()})}
function marker(pos,R,col,dur){const g=new THREE.Group();g.position.set(pos.x,.06,pos.z);W.scene.add(g);const m1=glow(col,3,{add:true,ds:true}),m2=glow(col,.6,{add:true,ds:true});
  const ring=new THREE.Mesh(thinRing,m1),fill=new THREE.Mesh(discGeo,m2);ring.rotation.x=fill.rotation.x=-Math.PI/2;g.add(ring,fill);
  fx(dur,k=>{const s=R*Math.min(1,k*3);ring.scale.setScalar(R);fill.scale.setScalar(s);m1.opacity=Math.min(1,k*4)*(k>.9?(1-k)*10:1);m2.opacity=.5*(k>.9?(1-k)*10:1)},()=>{W.scene.remove(g);m1.dispose();m2.dispose()})}
function ghost(obj,col,dur,op=.45){const c=SkeletonUtils.clone(obj);const rm=[];c.traverse(o=>{if(o.isLight||o.isSprite||o.isPoints)rm.push(o)});rm.forEach(o=>o.parent.remove(o));
  const m=glow(col,1.6,{add:true});m.opacity=op;c.traverse(o=>{if(o.isMesh){o.material=m;o.castShadow=false}});W.scene.add(c);
  fx(dur,k=>{m.opacity=op*(1-k)},()=>{W.scene.remove(c);m.dispose()})}
function orient(m,a,b,r){const d=b.clone().sub(a);const L=d.length();m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(UP,d.normalize());m.scale.set(r,L,r)}
function bolt(a,b,dur,col=0xbfe0ff){const g=new THREE.Group();W.scene.add(g);const segs=14;const m=glow(col,7,{add:true}),m2=glow(0x5a8cff,1.4,{add:true});m2.opacity=.5;
  const inner=[],outer=[];for(let i=0;i<segs;i++){inner.push(add(g,cylGeo,m));outer.push(add(g,cylGeo,m2))}
  const regen=()=>{const pts=[];for(let i=0;i<=segs;i++){const t=i/segs;const p=a.clone().lerp(b,t);if(i>0&&i<segs){const j=Math.sin(t*Math.PI)*.5;p.x+=rand(-j,j);p.y+=rand(-j,j);p.z+=rand(-j,j)}pts.push(p)}
    for(let i=0;i<segs;i++){orient(inner[i],pts[i],pts[i+1],.035);orient(outer[i],pts[i],pts[i+1],.11)}};
  regen();let rt=0;fx(dur,(k,dt)=>{rt-=dt;if(rt<=0){rt=.04;regen()}m.opacity=1-k*k;m2.opacity=.5*(1-k)},()=>{W.scene.remove(g);m.dispose();m2.dispose()})}

// ---------- damage numbers & bars ----------
const pv=V();
function place(el,p){pv.copy(p).project(camera);if(pv.z>1){el.style.display='none';return}el.style.display='';el.style.left=(pv.x*.5+.5)*innerWidth+'px';el.style.top=(-pv.y*.5+.5)*innerHeight+'px'}
function dmgNum(pos,amt,col,crit){const d=document.createElement('div');d.className='dmg';d.textContent=amt+(crit?'!':'');d.style.color=col;if(crit)d.style.fontSize='27px';worldUI.appendChild(d);
  const p=pos.clone();const vx=rand(-.8,.8);fx(.95,(k,dt)=>{p.y+=dt*1.6;p.x+=vx*dt;place(d,p);d.style.opacity=k<.65?1:1-(k-.65)/.35;d.style.transform=`translate(-50%,-50%) scale(${k<.12?1.7-k*5.8:1})`},()=>d.remove())}

// ---------- world helpers ----------
const TR={amp:1.2,flat:9};
function n2(x,z){return Math.sin(x*.21+Math.sin(z*.17)*2)*.6+Math.sin(z*.23+x*.11)*.5+Math.sin((x-z)*.5)*.2}
function hAt(x,z){const r=Math.hypot(x,z);const e=smooth(TR.flat,TR.flat+12,r);return (n2(x,z)*.5+.5)*TR.amp*e*1.6+e*e*TR.amp*1.4}
function terrain(mat){const g=new THREE.PlaneGeometry(140,140,180,180);g.rotateX(-Math.PI/2);const p=g.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,hAt(p.getX(i),p.getZ(i)));g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.receiveShadow=true;W.scene.add(m);return m}
function inCam(x,z){return z>.5&&Math.abs(x)<z*.9+2.2&&Math.hypot(x,z)<18}
function scatter(n,r0,r1,fn){let c=0,tries=0;while(c<n&&tries<n*40){tries++;const a=rand(0,TAU),r=r0+Math.sqrt(Math.random())*(r1-r0);const x=Math.cos(a)*r,z=Math.sin(a)*r;if(inCam(x,z))continue;fn(x,z,r);c++}}
function envBase(o){const s=W.scene;s.background=new THREE.Color(o.bot);s.fog=new THREE.Fog(o.fog[0],o.fog[1],o.fog[2]);
  const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new THREE.Color(o.top)},bot:{value:new THREE.Color(o.bot)}},
    vertexShader:`varying vec3 vP;void main(){vP=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(vP,1.0);}`,
    fragmentShader:`uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=normalize(vP).y;gl_FragColor=vec4(mix(bot,top,smoothstep(-.02,.45,h)),1.0);}`}));
  s.add(sky);
  s.add(new THREE.HemisphereLight(o.hemi[0],o.hemi[1],o.hemi[2]));

// ---------- combat ----------
function center(e){return e.g.position.clone().add(V(0,e.cy,0))}
function alive(e){return e.dead<=0&&e.spawn>.6}
function nearest(from,ex=[],maxD=1e9){let b=null,bd=maxD;for(const e of W.enemies){if(!alive(e)||ex.includes(e))continue;const d=Math.hypot(e.g.position.x-from.x,e.g.position.z-from.z);if(d<bd){bd=d;b=e}}return b}
function cluster(){let b=null,bs=-1;for(const e of W.enemies){if(!alive(e))continue;let s=0;for(const o of W.enemies)if(o!==e&&alive(o)&&e.g.position.distanceTo(o.g.position)<2.8)s++;if(s>bs){bs=s;b=e}}return b}
function damage(e,amt,dir,knock,crit,col='#fff'){if(e.dead>0)return;if(crit===undefined)crit=Math.random()<.2;if(crit)amt*=1.8;amt=Math.round(amt*rand(.9,1.1));e.hp-=amt;e.flash=1;if(e.drv&&e.hp>0&&!/atk/.test(e.drv.cur))dplay(e.drv,'e_hit',true,1.7);
  if(dir&&knock){const k=V(dir.x,0,dir.z);if(k.lengthSq()>0)e.vel.add(k.normalize().multiplyScalar(knock))}
  dmgNum(e.g.position.clone().add(V(0,e.h+.25,0)),amt,crit?'#ffd84a':col,crit);
  if(e.hp<=0){e.dead=e.drv?2:.6;if(e.drv)dplay(e.drv,'e_die',true,1.3);e.bar.style.display='none';parts.burst(center(e),50,{col:W.def.deathCol,cols:W.def.deathCols,b:4,speed:5,life:.8,size:.3,up:1,grav:3})}}
function explode(P,o){parts.burst(V(P.x,P.y+.3,P.z),o.n||90,{cols:o.cols,b:o.b||5,speed:o.speed||6,life:o.life||.7,size:o.size||.35,grav:o.grav??3,drag:o.drag??2,up:o.up??1.5});
  shockwave(P,o.col,o.R||2.5,.45,4);if(o.R2)after(.08,()=>shockwave(P,o.col2||o.col,o.R2,.6,2.5));
  flashLight(V(P.x,1.3,P.z),o.col,o.light||80,.55,(o.R||2.5)*3.5);W.shake=Math.max(W.shake,o.shake||.15);if(o.scorch)scorch(P,o.scorch);
  if(o.dmg)for(const e of W.enemies){if(e.dead>0)continue;const d=V(e.g.position.x-P.x,0,e.g.position.z-P.z);const L=d.length();if(L<o.hitR)damage(e,o.dmg*(1-L/o.hitR*.4),d,(o.knock||0)*(1-L/o.hitR*.5),undefined,o.dmgCol)}}
function projectile(o){const s=glowSprite(o.col,o.k||5,o.size||.9);s.position.copy(o.from);W.scene.add(s);const L=takeLight(o.col,o.li||30,o.ld||7);
  const tgt=()=>o.enemy&&o.enemy.dead<=0?center(o.enemy):o.to;let last=tgt().clone();
  fx(6,(k,dt,f)=>{last=tgt()||last;const d=last.clone().sub(s.position);const len=d.length(),step=o.speed*dt;if(len<=step+.1){s.position.copy(last);f.t=f.dur;return}
    s.position.addScaledVector(d.normalize(),step);L.position.copy(s.position);o.trail&&o.trail(s.position,dt)},
    ()=>{W.scene.remove(s);s.material.dispose();freeLight(L);o.onHit(s.position.clone(),o.enemy)})}

  if(e.frozen>0){e.frozen-=dt;if(Math.random()<.3){const c=center(e);parts.emit(c.x+rand(-.4,.4),c.y+rand(-.4,.4),c.z+rand(-.4,.4),0,.2,0,C.ice,2,.6,.12)}}
  if(e.burn>0){e.burn-=dt;e.burnT-=dt;const c=center(e);for(let i=0;i<2;i++)parts.emit(c.x+rand(-.3,.3),c.y+rand(-.3,.4),c.z+rand(-.3,.3),0,rand(.8,1.8),0,i?C.fire:C.ember,4,.5,.22,-.5,1);if(e.burnT<=0){e.burnT=.5;damage(e,7,null,0,false,'#ff9a3c')}}
  e.flash=Math.max(0,e.flash-dt*5);
  e.mats.forEach((m,i)=>{const b=e.base[i];m.emissive.copy(b.e);m.emissiveIntensity=b.i;if(e.frozen>0){tmpC.copy(ICE);m.emissive.lerp(tmpC,.85);m.emissiveIntensity=Math.max(b.i,e.drv?.3:1)}if(e.flash>0){m.emissive.lerp(WHITE,e.flash);m.emissiveIntensity=Math.max(m.emissiveIntensity,e.flash*(e.drv?.35:3))}});
  place(e.bar,g.position.clone().add(V(0,e.h+(e.float?.1:.15),0)));e.bar.firstChild.style.width=Math.max(0,e.hp/e.max*100)+'%'}

// ---------- scene load & HUD ----------
function disposeScene(s){s.traverse(o=>{if(o.geometry&&!o.geometry.userData.keep)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.userData.keep)return;for(const k in m){const v=m[k];if(v&&v.isTexture&&!v.userData.keep)v.dispose()}m.dispose()})}})}
let cur=-1;
function load(i){if(i===cur)return;cur=i;FX=[];if(W.scene){W.scene.remove(parts.obj);disposeScene(W.scene)}worldUI.innerHTML='';
  W.scene=new THREE.Scene();renderPass.scene=W.scene;W.enemies=[];W.lights=[];W.shake=0;parts.reset();W.scene.add(parts.obj);
  const def=SCENES[i];W.def=def;def.build();bloom.strength=def.bloom[0];bloom.radius=def.bloom[1];bloom.threshold=def.bloom[2];
  const hb=useModels&&MODELS[def.name]?modelHero(def):def.hero();def.heroB=hb;const H={g:hb.parts.root,P:hb.parts,rig:hb.rig,drv:hb.drv,extra:hb.extra,hold:hb.hold,walk:0,moving:false,lift:0,castT:0,both:false,up:false,lock:0,spin:0,goal:V(),goalT:0,faceTarget:0,aim:null};
  H.g.traverse(o=>{if(o.isMesh&&!o.material.isMeshBasicMaterial)o.castShadow=true});W.scene.add(H.g);W.hero=H;
  for(let k=0;k<5;k++)spawnEnemy();
  document.documentElement.style.setProperty('--accent',def.accent);$('#name').textContent=def.name;$('#sub').textContent=def.title;$('#blurb').textContent=def.blurb;
  const bar=$('#bar');bar.innerHTML='';def.abilities.forEach((a,j)=>{const s=document.createElement('div');s.className='slot';s.style.setProperty('--c',a.color);s.innerHTML=`<div class="ic"><i class="ti ti-${a.icon}"></i></div><div class="cd"></div><span class="key">${'QWE'[j]}</span>`;s.onclick=()=>{castA(j);W.autoT=4};bar.appendChild(s);a.el=s;a.cdT=0});
  $('#tipName').textContent='';$('#tipDesc').textContent='';W.autoT=1.2;W.next=0;
  document.querySelectorAll('.top .hero').forEach((b,j)=>b.classList.toggle('on',j===i))}
function castA(j){const a=W.def.abilities[j];if(!a||a.cdT>0)return;a.cdT=a.cd;a.cast();const an=ANIM_FOR[a.name];if(W.hero.drv&&an)dplay(W.hero.drv,an[0],true,an[1]);$('#tipName').textContent=a.name;$('#tipDesc').textContent=a.desc;
  a.el.classList.add('flash');setTimeout(()=>a.el.classList.remove('flash'),180)}
const top=$('#top');
SCENES.forEach((s,i)=>{const b=document.createElement('button');b.className='hero';b.textContent=`${i+1}  ${s.name}`;b.onclick=()=>load(i);top.appendChild(b)});
top.appendChild(Object.assign(document.createElement('span'),{className:'sep'}));
const camBtn=document.createElement('button');camBtn.textContent='Camera: cinematic';top.appendChild(camBtn);
const autoBtn=document.createElement('button');autoBtn.textContent='Auto-cast: on';autoBtn.className='on';top.appendChild(autoBtn);
let camMode='cine';const toggleCam=()=>{camMode=camMode==='cine'?'game':'cine';camBtn.textContent='Camera: '+(camMode==='cine'?'cinematic':'gameplay')};
const toggleAuto=()=>{W.auto=!W.auto;autoBtn.textContent='Auto-cast: '+(W.auto?'on':'off');autoBtn.classList.toggle('on',W.auto)};
camBtn.onclick=toggleCam;autoBtn.onclick=toggleAuto;
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();const qi='qwe'.indexOf(k);if(qi>=0){castA(qi);W.autoT=4}else if(k>='1'&&k<='4')load(+k-1);else if(k==='c')toggleCam();else if(k==='a')toggleAuto();else if(k==='m'){useModels=!useModels;const c=cur;cur=-1;load(c)}});

// ---------- camera & loop ----------
const look=V(),camPos=V();
window.__dbg={W,camera,get cam(){return camMode},set cam(v){camMode=v}};
function camUpdate(dt,t){const h=W.hero.g.position;if(camMode==='close'){camera.position.set(h.x+Math.sin(W.hero.g.rotation.y+.6)*3.2,1.6,h.z+Math.cos(W.hero.g.rotation.y+.6)*3.2);camera.lookAt(h.x,1,h.z);return}
  if(camMode==='cine'){const a=(W.def.camA||0)+Math.sin(t*.12)*.55;const tx=h.x*.4,tz=h.z*.4;camPos.set(Math.sin(a)*10.2+tx*.5,3.5,Math.cos(a)*10.2+tz*.5);look.set(tx,1.15,tz)}
  else{camPos.set(h.x*.6,13,h.z*.6+10.5);look.set(h.x*.6,0,h.z*.6)}
  camera.position.lerp(camPos,Math.min(1,dt*4));camera.lookAt(look);
  if(W.shake>.001){camera.position.x+=rand(-1,1)*W.shake;camera.position.y+=rand(-1,1)*W.shake;W.shake*=Math.exp(-dt*7)}}
const clock=new THREE.Clock();let T=0,first=true;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),1/20);T+=dt;
  W.def.ambient&&W.def.ambient(dt,T);heroUpdate(W.hero,dt,T);for(const e of W.enemies)enemyUpdate(e,dt,T);
  for(let i=0;i<FX.length;i++){const f=FX[i];f.t+=dt;const k=Math.min(1,f.t/f.dur);f.up&&f.up(k,dt,f);if(f.t>=f.dur){f.done=true;f.end&&f.end()}}FX=FX.filter(f=>!f.done);
  parts.update(dt);
  W.def.abilities.forEach(a=>{a.cdT=Math.max(0,a.cdT-dt);a.el.style.setProperty('--p',a.cdT/a.cd)});
  if(W.auto){W.autoT-=dt;if(W.autoT<=0){castA(W.next);W.next=(W.next+1)%3;W.autoT=2.3}}
  camUpdate(dt,T);composer.render();
  if(first){first=false;$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),700)}}
camera.position.set(0,3.5,10);Promise.all([preload(),preloadAnims()]).then(()=>{load(0);loop()});
</script>
