<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFX Audition</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#111014;--panel:#1a1920;--line:#34323d;--text:#e9e4da;--muted:#9a94a6;--accent:#c9a45a;--wave:#7fa7c9;--onset:#f2d27a;--warn:#e07a5f}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:18px;margin:0 0 4px;color:var(--accent)}
p.sub{margin:0 0 18px;color:var(--muted)}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px}
section h2{font-size:14px;margin:0;font-family:ui-monospace,Consolas,monospace}
section .prompt{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.tags span{display:inline-block;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:10px;margin-left:6px;color:var(--muted)}
.take{display:grid;grid-template-columns:88px 1fr 230px;gap:10px;align-items:center;margin:6px 0}
button{background:#26242e;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)} button.on{background:var(--accent);color:#16141a}
canvas{width:100%;height:48px;display:block;background:#141319;border-radius:4px}
.stats{font:12px/1.35 ui-monospace,Consolas,monospace;color:var(--muted)}
.stats b{color:var(--text);font-weight:600} .stats .w{color:var(--warn)}
@media (max-width:700px){.take{grid-template-columns:70px 1fr}.stats{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>SFX audition</h1>
  <p class="sub">ElevenLabs takes listed in <code>index.json</code>. Click to play (loops play looped, click again to stop). Yellow ticks on sliced sounds = detected hits the game will cut into single one-shots.</p>
  <div id="list">Loading…</div>
</main>
<script type="module">
// Decodes every take, draws its waveform, measures peak / RMS / lead-in silence, and for `slice` sounds finds the
// onsets (the footsteps inside one take). Results are also written to window.__stats for headless checks.
const $ = s => document.querySelector(s);
const fail = msg => { $('#list').innerHTML = `<section style="border-color:var(--warn)"><b style="color:var(--warn)">Can't load the sounds.</b><br>${msg}</section>`; throw new Error(msg); };
addEventListener('unhandledrejection', e => fail(String(e.reason?.message || e.reason)));
if (location.protocol === 'file:') fail('This page was opened from disk (file://), where the browser blocks reading the sound files. Open it through the local server instead: <code>http://localhost:8126/assets/sfx/audition.html</code> (start <code>play.bat</code> / <code>serve.py</code> if nothing is running).');
const getJSON = u => fetch(u, {cache: 'no-store'}).then(r => r.ok ? r.json() : fail(`${u}: HTTP ${r.status}`));
const [idx, man] = await Promise.all([getJSON('index.json'), getJSON('manifest.json')]);
const M = Object.fromEntries(man.sounds.filter(s => s.id).map(s => [s.id, s]));
const dec = new OfflineAudioContext(1, 1, 44100);
let ac = null, cur = null;
const stats = window.__stats = {};
function onsets(d, sr) {   // envelope in 10 ms hops; an onset = the envelope jumps well above its recent level
  const hop = sr / 100 | 0, env = [];
  for (let i = 0; i + hop <= d.length; i += hop) { let s = 0; for (let j = i; j < i + hop; j++) s += d[j] * d[j]; env.push(Math.sqrt(s / hop)); }
  const mx = Math.max(...env), out = [];
  for (let k = 3; k < env.length; k++) {
    const prev = (env[k - 1] + env[k - 2] + env[k - 3]) / 3;
    if (env[k] > mx * .18 && env[k] > prev * 2.2 && (!out.length || k - out[out.length - 1] > 18)) out.push(k);
  }
  return out.map(k => k / 100);
}
function draw(cv, d, marks, dur) {
  const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio, q = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  q.fillStyle = css.getPropertyValue('--wave'); const step = d.length / w;
  for (let x = 0; x < w; x++) { let m = 0; for (let i = x * step | 0, e = (x + 1) * step | 0; i < e; i++) m = Math.max(m, Math.abs(d[i])); const a = m * h / 2; q.fillRect(x, h / 2 - a, 1, Math.max(1, a * 2)); }
  q.fillStyle = css.getPropertyValue('--onset');
  for (const t of marks) q.fillRect(t / dur * w - 1, 0, 2 * devicePixelRatio, h);
}
const list = $('#list'); list.textContent = '';
for (const [id, e] of Object.entries(idx.sounds)) {
  const m = M[id] || {}, sec = document.createElement('section');
  sec.innerHTML = `<h2>${id}<span class="tags">${e.loop ? '<span>loop</span>' : ''}${e.slice ? '<span>slice</span>' : ''}${m.dur ? `<span>${m.dur}s</span>` : ''}</span></h2><div class="prompt"></div>`;
  sec.querySelector('.prompt').textContent = m.prompt || '';
  list.appendChild(sec);
  for (const f of e.files) {
    const row = document.createElement('div'); row.className = 'take';
    row.innerHTML = `<button>▶ ${f.match(/_(\d+)\.mp3$/)[1]}</button><canvas></canvas><div class="stats">decoding…</div>`;
    sec.appendChild(row);
    const buf = await dec.decodeAudioData(await fetch(f).then(r => r.arrayBuffer()));
    const d = buf.getChannelData(0), sr = buf.sampleRate;
    let pk = 0, ss = 0, lead = 0; for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); pk = Math.max(pk, a); ss += d[i] * d[i]; }
    while (lead < d.length && Math.abs(d[lead]) < pk * .05) lead++;
    const rms = Math.sqrt(ss / d.length), db = v => (20 * Math.log10(v || 1e-9)).toFixed(1);
    const on = e.slice ? onsets(d, sr) : [];
    // loop seam: level jump between the last and first 20 ms (a click risk if large)
    const n = sr / 50 | 0, rm = (a, b) => { let s = 0; for (let i = a; i < b; i++) s += d[i] * d[i]; return Math.sqrt(s / (b - a)); };
    const seam = e.loop ? Math.abs(db(rm(d.length - n, d.length)) - db(rm(0, n))) : 0;
    stats[f] = {dur: +buf.duration.toFixed(2), ch: buf.numberOfChannels, peak: +pk.toFixed(3), peakDb: +db(pk), rmsDb: +db(rms), leadMs: Math.round(lead / sr * 1000), onsets: on.length ? on : undefined, seamDb: e.loop ? +seam.toFixed(1) : undefined};
    const S = stats[f];
    row.querySelector('.stats').innerHTML = `<b>${S.dur}s</b> ${S.ch}ch · peak <b class="${S.peak > .98 ? 'w' : ''}">${S.peakDb} dB</b> · rms ${S.rmsDb} dB<br>lead-in <span class="${S.leadMs > 60 ? 'w' : ''}">${S.leadMs} ms</span>${on.length ? ` · <b>${on.length}</b> hits` : ''}${e.loop ? ` · seam Δ <span class="${seam > 3 ? 'w' : ''}">${S.seamDb} dB</span>` : ''}`;
    requestAnimationFrame(() => draw(row.querySelector('canvas'), d, on, buf.duration));
    const btn = row.querySelector('button');
    btn.onclick = () => {
      ac = ac || new AudioContext();
      if (cur) { cur.src.stop(); cur.btn.classList.remove('on'); const same = cur.btn === btn; cur = null; if (same) return; }
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = !!e.loop; src.connect(ac.destination); src.start();
      btn.classList.add('on'); cur = {src, btn}; src.onended = () => { if (cur?.src === src) { btn.classList.remove('on'); cur = null; } };
    };
  }
}
const pre = document.createElement('pre'); pre.id = 'json'; pre.hidden = true; pre.textContent = JSON.stringify(stats); document.body.appendChild(pre);
</script>
</body>
</html>
